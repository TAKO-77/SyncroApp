<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Syncro">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Syncro</title>
<meta name="description" content="Agenda, calendário, tarefas e finanças num só lugar, sincronizados entre o computador e o telemóvel.">
<!-- Link previews (WhatsApp, Facebook, LinkedIn, X). These services need absolute URLs, so the image points at the published site. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Syncro">
<meta property="og:title" content="Syncro · Organiza o teu dia num só lugar">
<meta property="og:description" content="Agenda, calendário, tarefas e finanças num só lugar, sincronizados entre o computador e o telemóvel.">
<meta property="og:url" content="https://app.getsyncro.workers.dev/">
<meta property="og:image" content="https://app.getsyncro.workers.dev/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logótipo da Syncro">
<meta property="og:locale" content="pt_PT">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- The start-up logo paints before the bundle loads, so the saved theme has to be set here. -->
<script>try{if(localStorage.getItem('syncro-theme')==='light'){document.documentElement.dataset.theme='light';document.querySelector('meta[name="theme-color"]').setAttribute('content','#e9e9e5')}}catch(e){}</script>
</head>
<body>

    <svg class="splash-blade" style="--i:2;--x:.28;--y:.96" viewBox="40 38 1212 1212"><path d="M951 669L1006 765C921.1 957.7 726.4 1128.5 537 1205L463 1044C646.9 965.6 828.5 849.2 951 669Z"/></svg>

    <svg class="splash-dot" viewBox="40 38 1212 1212"><circle cx="646" cy="644" r="113"/></svg>
  </div>
</div>
<div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
